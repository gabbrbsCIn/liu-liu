<title>Diário do Leão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with the rubro-negro stripe and tabs; Resumo opens on a scoreboard of the whole record, then records, seasons chart and moments. Each game is an ingresso (ticket stub). */
:root{
  --bg:#f3f3f4; --panel:#ffffff; --raise:#ececee; --line:#e0dfe2; --line-2:#cbc9ce;
  --ink:#161314; --ink-2:#58525a; --ink-3:#8a858d;
  --red:#c8102e; --red-ink:#ffffff; --red-dim:#c8102e14; --gold:#9a6f00;
  --stripe-r:#c8102e; --stripe-k:#151213;
  /* resultados: V vermelho, E dourado, D azul (paleta validada p/ daltonismo, sempre com letra/legenda) */
  --v:#c8102e; --e:#b8860b; --d:#3d64a8;
  --f-disp:"Big Shoulders Display", "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  --f-ui:"Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141112; --panel:#1c1819; --raise:#262122; --line:#2d2829; --line-2:#3d3638;
  --ink:#f3eeec; --ink-2:#b6adab; --ink-3:#80777a;
  --red:#e0405a; --red-ink:#ffffff; --red-dim:#e0405a1f; --gold:#d6ad45;
  --stripe-r:#c8102e; --stripe-k:#050404;
  --v:#e0405a; --e:#9c9a2a; --d:#6a8ee0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141112; --panel:#1c1819; --raise:#262122; --line:#2d2829; --line-2:#3d3638;
  --ink:#f3eeec; --ink-2:#b6adab; --ink-3:#80777a;
  --red:#e0405a; --red-ink:#ffffff; --red-dim:#e0405a1f; --gold:#d6ad45;
  --stripe-r:#c8102e; --stripe-k:#050404;
  --v:#e0405a; --e:#9c9a2a; --d:#6a8ee0; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--stripe-k)}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.wrap{max-width:1080px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono); font-size:.86em; letter-spacing:.01em}
.kick{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
h1,h2,h3{text-wrap:balance; margin:0}
h2{font-family:var(--f-disp); font-weight:800; font-size:28px; letter-spacing:.01em; text-transform:uppercase; line-height:1}
h3{font-size:15px; font-weight:700}

/* ===== header ===== */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--stripe-k); color:#f3eeec}
.stripes{height:10px; background:repeating-linear-gradient(to bottom, var(--stripe-r) 0 5px, var(--stripe-k) 5px 10px)}
.bar{display:flex; align-items:center; gap:16px; padding-block:10px 0; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; color:#f3eeec; text-decoration:none}
.brand b{font-family:var(--f-disp); font-weight:900; font-size:26px; text-transform:uppercase; letter-spacing:.02em; line-height:1}
.brand span{font-size:12px; color:#a59c9e}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; width:100%; margin-top:6px}
.tabs a{flex:none; color:#c9c0c2; text-decoration:none; font-weight:600; font-size:14px; padding:9px 12px 11px; border-bottom:3px solid transparent}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff; border-color:var(--stripe-r)}
.tabs a.cta{margin-left:auto; color:#fff}
.tabs a.cta::before{content:"+ "; color:#ff6b7e}

main{padding-block:24px 64px}
.view{display:grid; gap:28px}
.sec{display:grid; gap:14px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.sec-h p{margin:0; color:var(--ink-2); font-size:14px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px}

/* ===== placar geral ===== */
.board{background:var(--stripe-k); color:#f3eeec; border-radius:14px; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.board .l{padding:22px 22px 20px; display:grid; gap:6px; align-content:start}
.board .big{font-family:var(--f-disp); font-weight:900; font-size:clamp(72px,14vw,128px); line-height:.85; letter-spacing:-.01em}
.board .big small{font-size:.32em; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#ff6b7e; margin-left:6px}
.board .sub{color:#b9b0b2; font-size:14px; max-width:40ch}
.board .r{padding:22px; display:grid; gap:14px; align-content:center; background:#ffffff08; border-left:1px solid #ffffff14}
.vde{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.vde div{display:grid; gap:2px}
.vde b{font-family:var(--f-disp); font-weight:800; font-size:44px; line-height:.9}
.vde span{font-size:12px; color:#a59c9e; text-transform:uppercase; letter-spacing:.08em; display:flex; align-items:center; gap:6px}
.vde i{width:8px; height:8px; border-radius:2px; display:inline-block}
.rb{display:flex; gap:2px; height:12px; border-radius:4px; overflow:hidden}
.rb i{display:block; height:100%}
.facts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; font-size:13px; color:#b9b0b2}
.facts b{display:block; font-family:var(--f-disp); font-weight:800; font-size:26px; color:#f3eeec; line-height:1}

/* ===== recordes ===== */
.recs{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.rec{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid; gap:4px; text-decoration:none; color:inherit; align-content:start}
a.rec:hover{border-color:var(--line-2)}
.rec .v{font-family:var(--f-disp); font-weight:800; font-size:36px; line-height:1; letter-spacing:.01em}
.rec .v em{font-style:normal; font-size:.5em; color:var(--ink-3); margin-left:4px; text-transform:uppercase}
.rec p{margin:0; font-size:13.5px; color:var(--ink-2)}

/* ===== chart ===== */
.chart{position:relative}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart text{font-family:var(--f-ui); font-size:11px; fill:var(--ink-3)}
.chart .lbl{fill:var(--ink-2); font-weight:600}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12.5px; padding:8px 10px; border-radius:8px; white-space:nowrap; transform:translate(-50%,calc(-100% - 10px)); z-index:5; line-height:1.4}
.tip b{font-weight:700}
details.tbl summary{cursor:pointer; color:var(--ink-2); font-size:13.5px}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:12px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}

.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
.hbars{display:grid; gap:8px}
.hb{display:grid; grid-template-columns:44px minmax(0,1fr) 28px; align-items:center; gap:10px; font-size:13.5px}
.hb .t{height:12px; background:var(--raise); border-radius:4px; overflow:hidden}
.hb .t i{display:block; height:100%; background:var(--red); border-radius:0 4px 4px 0}
.hb b{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.scores{display:flex; flex-wrap:wrap; gap:8px}
.sc{display:grid; justify-items:center; gap:2px; min-width:64px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.sc b{font-family:var(--f-disp); font-weight:800; font-size:24px; line-height:1}
.sc span{font-size:12px; color:var(--ink-3)}

/* ===== momentos ===== */
.moments{display:grid; gap:0; border-left:2px solid var(--line-2); margin-left:6px}
.mo{position:relative; padding:0 0 18px 20px; display:grid; gap:2px; text-decoration:none; color:inherit}
.mo::before{content:""; position:absolute; left:-7px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--panel); border:3px solid var(--red)}
.mo.t::before{border-color:var(--gold)}
.mo .when{font-size:12.5px; color:var(--ink-3)}
.mo b{font-weight:700}
.mo:hover b{text-decoration:underline}

/* ===== pills ===== */
.res{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:6px; font-weight:700; font-size:12.5px; color:#fff; flex:none}
.res.V{background:var(--v)} .res.E{background:var(--e)} .res.D{background:var(--d)}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--raise); color:var(--ink-2); white-space:nowrap}
.tag.t{background:color-mix(in srgb, var(--gold) 16%, transparent); color:var(--gold)}
.tag.c{background:var(--red-dim); color:var(--red)}
.form{display:flex; gap:3px}
.form .res{width:18px; height:18px; font-size:10.5px; border-radius:4px}

/* ===== lista de jogos ===== */
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.filters input[type=search],.filters select{height:38px; border:1px solid var(--line-2); background:var(--panel); border-radius:8px; padding:0 12px; min-width:0}
.filters input[type=search]{flex:1 1 200px}
.seg{display:flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:var(--panel)}
.seg button{border:0; background:none; padding:0 12px; height:36px; font-weight:600; font-size:13.5px; color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.chk{display:inline-flex; gap:6px; align-items:center; font-size:13.5px; color:var(--ink-2)}
.season{display:grid; gap:8px}
.season-h{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding-top:8px}
.season-h h3{font-family:var(--f-disp); font-weight:900; font-size:30px; line-height:1}
.season-h span{font-size:13.5px; color:var(--ink-2)}
.games{display:grid; gap:6px}
.g{display:grid; grid-template-columns:62px minmax(0,1fr) auto; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; text-decoration:none; color:inherit; position:relative}
.g:hover{border-color:var(--line-2)}
.g .dt{display:grid; line-height:1.1; border-right:1px dashed var(--line-2); padding-right:12px}
.g .dt b{font-family:var(--f-disp); font-weight:800; font-size:22px}
.g .dt span{font-size:11.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em}
.g .who{display:grid; gap:4px; min-width:0}
.g .who strong{font-weight:600; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.g .who .tags{display:flex; gap:4px; flex-wrap:wrap}
.g .scr{display:flex; align-items:center; gap:10px}
.g .scr b{font-family:var(--f-disp); font-weight:800; font-size:26px; letter-spacing:.02em}
.empty{padding:28px; text-align:center; color:var(--ink-2); border:1px dashed var(--line-2); border-radius:12px}

/* ===== ingresso (detalhe) ===== */
.back{display:inline-flex; gap:6px; color:var(--ink-2); text-decoration:none; font-weight:600; font-size:14px}
.ticket{display:grid; grid-template-columns:minmax(0,1fr) 220px; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; position:relative}
.ticket .main{padding:0 0 20px}
.ticket .main > .stripes{height:8px}
.ticket .hd{display:flex; justify-content:space-between; gap:12px; padding:16px 22px 0; flex-wrap:wrap}
.ticket .match{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:16px; padding:18px 22px 6px}
.ticket .team{font-family:var(--f-disp); font-weight:800; font-size:clamp(24px,5vw,40px); text-transform:uppercase; line-height:.95; overflow-wrap:anywhere}
.ticket .team.away{text-align:right}
.ticket .score{font-family:var(--f-disp); font-weight:900; font-size:clamp(56px,11vw,96px); line-height:.85; display:flex; gap:10px; align-items:center}
.ticket .score i{font-style:normal; font-size:.45em; color:var(--ink-3)}
.ticket .when{padding:6px 22px 0; color:var(--ink-2); font-size:14.5px}
.ticket .tags{display:flex; gap:6px; flex-wrap:wrap; padding:12px 22px 0}
.stub{border-left:2px dashed var(--line-2); padding:20px 18px; display:grid; gap:12px; align-content:start; background:var(--raise); position:relative}
.stub::before,.stub::after{content:""; position:absolute; left:-11px; width:20px; height:20px; border-radius:50%; background:var(--bg); border:1px solid var(--line)}
.stub::before{top:-11px} .stub::after{bottom:-11px}
.field{display:grid; gap:1px}
.field span{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.field b{font-family:var(--f-mono); font-weight:500; font-size:14px}
.field b.todo{color:var(--ink-3); font-family:var(--f-ui); font-weight:500; font-style:italic}
.warn{display:flex; gap:10px; padding:10px 14px; border-radius:10px; background:color-mix(in srgb, var(--gold) 14%, transparent); color:var(--ink); font-size:14px}
.ctx{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.ctx .rec .v{font-size:30px}
.note{margin:0; font-size:16px; max-width:65ch}
.photos{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.photos figure{margin:0; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:var(--raise); max-width:100%}
.photos img{width:100%; height:100%; object-fit:cover; display:block}
.drop{aspect-ratio:4/3; border:2px dashed var(--line-2); border-radius:10px; display:grid; place-items:center; text-align:center; color:var(--ink-2); font-size:13.5px; padding:12px; cursor:pointer; background:var(--panel); max-width:100%}
.drop:hover{border-color:var(--red); color:var(--red)}
.drop input{position:absolute; width:1px; height:1px; opacity:0}
.drop b{display:block; font-size:24px; line-height:1; margin-bottom:4px}
.pager{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.pager a{color:var(--ink-2); text-decoration:none; font-size:14px; font-weight:600}

/* ===== form ===== */
.frm{display:grid; gap:18px; max-width:760px}
.fs{display:grid; gap:12px; border:0; padding:0; margin:0}
.fs legend{font-family:var(--f-disp); font-weight:800; font-size:22px; text-transform:uppercase; padding:0; margin-bottom:4px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.in{display:grid; gap:5px; font-size:13px; font-weight:600; color:var(--ink-2); min-width:0}
.in input,.in select,.in textarea{height:42px; border:1px solid var(--line-2); border-radius:8px; background:var(--panel); padding:0 12px; font-weight:400; font-size:15px; color:var(--ink); width:100%}
.in textarea{height:auto; min-height:90px; padding:10px 12px; resize:vertical}
.in small{font-weight:400; color:var(--ink-3)}
.scoreline{display:grid; grid-template-columns:minmax(0,1fr) 72px auto 72px minmax(0,1fr); gap:10px; align-items:end}
.scoreline .x{font-family:var(--f-disp); font-weight:800; font-size:28px; padding-bottom:4px; color:var(--ink-3)}
.scoreline input[type=number]{font-family:var(--f-disp); font-weight:800; font-size:26px; text-align:center}
.sport-fixed{height:42px; display:flex; align-items:center; font-family:var(--f-disp); font-weight:800; font-size:22px; text-transform:uppercase}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips label{display:inline-flex}
.chips input{position:absolute; opacity:0; width:1px; height:1px}
.chips span{padding:6px 12px; border-radius:999px; border:1px solid var(--line-2); font-size:13.5px; font-weight:600; cursor:pointer; background:var(--panel)}
.chips input:checked+span{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--red); outline-offset:2px}
.btn{height:44px; padding:0 20px; border-radius:10px; border:0; background:var(--red); color:var(--red-ink); font-weight:700; font-size:15px}
.btn.ghost{background:none; border:1px solid var(--line-2); color:var(--ink)}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.proto{font-size:13px; color:var(--ink-3)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; z-index:40; max-width:calc(100% - 32px)}

@media (max-width:760px){
  .board{grid-template-columns:1fr}
  .board .r{border-left:0; border-top:1px solid #ffffff14}
  .two{grid-template-columns:1fr}
  .ticket{grid-template-columns:1fr}
  .stub{border-left:0; border-top:2px dashed var(--line-2); grid-template-columns:repeat(2,minmax(0,1fr))}
  .stub::before,.stub::after{top:-11px; bottom:auto}
  .stub::before{left:-11px} .stub::after{left:auto; right:-11px}
  .scoreline{grid-template-columns:minmax(0,1fr) 64px auto 64px; }
  .scoreline .opp{grid-column:1/-1; grid-row:1}
}
@media (max-width:440px){
  .g{grid-template-columns:52px minmax(0,1fr) auto; gap:10px; padding:10px 12px}
  .g .scr .res{display:none}
  .facts b{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(4px)}to{transform:none}}
}
</style>

</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

function record(list){
  const r = {J:list.length, V:0, E:0, D:0, GP:0, GC:0};
  for (const g of list){ r[res(g)]++; r.GP += g.s; r.GC += g.a; }
  r.apr = r.J ? (3*r.V + r.E) / (3*r.J) : 0;
  return r;
}

function streaks(list){
  let un = 0, w = 0, best = {n:0}, bestW = {n:0}, unStart, wStart;
  list.forEach((g, i) => {
    if (res(g) !== 'D'){ if (!un) unStart = i; un++; if (un > best.n) best = {n:un, from:list[unStart], to:g}; } else un = 0;
    if (res(g) === 'V'){ if (!w) wStart = i; w++; if (w > bestW.n) bestW = {n:w, from:list[wStart], to:g}; } else w = 0;
  });
  return {best, bestW, current:un};
}

function seasonsData(L){
  const ys = {}; L.forEach(g => { const y = +g.d.slice(0, 4); (ys[y] ??= {V:0, E:0, D:0})[res(g)]++; });
  const keys = Object.keys(ys).map(Number), out = [];
  for (let y = Math.min(...keys); y <= Math.max(...keys); y++) out.push({y, ...(ys[y] || {V:0, E:0, D:0})});
  return out;
}
function seasonTable(L){
  return `<table><thead><tr><th>Ano</th><th class="num">J</th><th class="num">V</th><th class="num">E</th><th class="num">D</th><th class="num">Aprov.</th></tr></thead><tbody>${
    seasonsData(L).filter(s => s.V + s.E + s.D).map(s => { const j = s.V + s.E + s.D;
      return `<tr><td>${s.y}</td><td class="num">${j}</td><td class="num">${s.V}</td><td class="num">${s.E}</td><td class="num">${s.D}</td><td class="num">${pct((3*s.V + s.E) / (3*j))}</td></tr>`; }).join('')
  }</tbody></table>`;
}

function drawChart(){
  const el = document.getElementById('chart'); if (!el) return;
  const data = seasonsData(sorted());
  const W = 720, H = 240, pl = 28, pr = 6, pt = 18, pb = 26;
  const max = Math.ceil(Math.max(...data.map(s => s.V + s.E + s.D)) / 5) * 5;
  const step = (W - pl - pr) / data.length, bw = Math.min(28, step * .62);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const topPath = (x, y0, w, h, r) => { r = Math.min(r, h, w / 2);
    return `M${x},${y0 + h}V${y0 + r}Q${x},${y0} ${x + r},${y0}H${x + w - r}Q${x + w},${y0} ${x + w},${y0 + r}V${y0 + h}Z`; };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Jogos por temporada, divididos em vitórias, empates e derrotas">`;
  for (let v = 0; v <= max; v += 5) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const best = data.reduce((a, b) => (b.V + b.E + b.D) > (a.V + a.E + a.D) ? b : a);
  data.forEach((d, i) => {
    const x = pl + i * step + (step - bw) / 2, tot = d.V + d.E + d.D;
    let acc = 0; const segs = [['V', d.V], ['E', d.E], ['D', d.D]].filter(q => q[1]);
    segs.forEach(([k, n], j) => {
      const y1 = y(acc + n), y0 = y(acc), h = y0 - y1 - (acc ? 2 : 0);
      s += j === segs.length - 1 ? `<path d="${topPath(x, y1, bw, h, 4)}" fill="var(--${k.toLowerCase()})"/>`
                                 : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="var(--${k.toLowerCase()})"/>`;
      acc += n;
    });
    if (!tot) s += `<text x="${x + bw / 2}" y="${y(0) - 4}" text-anchor="middle">–</text>`;
    if (d === best) s += `<text class="lbl" x="${x + bw / 2}" y="${y(tot) - 6}" text-anchor="middle">${tot}</text>`;
    const show = i === 0 || i === data.length - 1 || d.y % 2 === 1;
    if (show) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${String(d.y).slice(i === 0 || i === data.length - 1 ? 0 : 2)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${pl + i * step}" y="${pt}" width="${step}" height="${H - pt - pb}" fill="transparent"/>`;
  });
  el.innerHTML = s + `</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  const show = e => { const r = e.target.closest('.hit'); if (!r) { tip.hidden = true; return; }
    const d = data[+r.dataset.i], tot = d.V + d.E + d.D, sb = svg.getBoundingClientRect(), k = sb.width / W;
    tip.innerHTML = tot ? `<b>${d.y}</b> · ${tot} jogo${tot > 1 ? 's' : ''}<br>${d.V}V ${d.E}E ${d.D}D · ${pct((3*d.V + d.E) / (3*tot))}` : `<b>${d.y}</b> · nenhum jogo`;
    tip.style.left = Math.min(Math.max((+r.getAttribute('x') + step / 2) * k, 70), sb.width - 70) + 'px';
    tip.style.top = y(tot) * k + 'px'; tip.hidden = false; };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => tip.hidden = true);
}

        <div class="hd"><span class="kick">Jogo nº ${i + 1} de ${L.length}</span><span class="kick">${esc(g.comp || 'Competição a preencher')}</span></div>
        <div class="match">
          <div class="team">Sport</div>
          <div class="score n">${g.s}<i>x</i>${g.a}</div>
          <div class="team away">${esc(g.o)}</div>
        </div>
        <div class="when">${fmtLong(g.d)} · ${{V:'vitória', E:'empate', D:'derrota'}[r]}</div>
        ${g.tags.length || g.star ? `<div class="tags">${g.tags.map(tagHtml).join('')}${g.star ? tagHtml('marcado com * na sua lista') : ''}</div>` : ''}
      </div>
      <aside class="stub">
        ${fld('Estádio', g.estadio)}${fld('Setor', g.setor)}${fld('Público', g.publico ? g.publico.toLocaleString('pt-BR') : '')}${fld('Com quem', g.com)}
      </aside>
    </article>

    <div class="sec">
      <div class="sec-h"><h2>Contexto</h2><p>Calculado com os jogos que você viu até este dia.</p></div>
      <div class="ctx">
        <div class="rec"><span class="kick">Contra o ${esc(g.o)}</span><div class="v">${prevSame.length ? `${prevSame.length + 1}º jogo` : 'Primeira vez'}</div>
          <p>${prevSame.length ? `Antes deste: ${rs.V}V ${rs.E}E ${rs.D}D.` : 'Você nunca tinha visto esse confronto.'}</p></div>
        <div class="rec"><span class="kick">Sequência invicta</span><div class="v n">${un}<em>jogo${un === 1 ? '' : 's'}</em></div>
          <p>${r === 'D' ? 'A derrota encerrou a sequência.' : 'Sem ver o Sport perder, contando este jogo.'}</p></div>
        <div class="rec"><span class="kick">Desde o jogo anterior</span><div class="v n">${days === null ? '–' : days}<em>${days === null ? '' : days === 1 ? 'dia' : 'dias'}</em></div>
          <p>${prev ? `${fmt(prev.d)}, ${prev.s}x${prev.a} ${esc(prev.o)}.` : 'Seu primeiro jogo registrado.'}</p></div>
        <div class="rec"><span class="kick">Aproveitamento até aqui</span><div class="v n">${pct(rAll.apr)}</div>
          <p>${rAll.V}V ${rAll.E}E ${rAll.D}D nos seus ${rAll.J} primeiros jogos.</p></div>
      </div>
    </div>

    ${g.note ? `<div class="sec"><div class="sec-h"><h2>Anotação</h2></div><p class="note">${esc(g.note)}</p></div>` : ''}

    <div class="sec">
      <div class="sec-h"><h2>Fotos</h2><p>${g.photos.length ? `${g.photos.length} foto${g.photos.length > 1 ? 's' : ''}` : 'Nenhuma foto ainda.'}</p></div>
      <div class="photos">
        ${g.photos.map(u => `<figure><img src="${u}" alt="Foto do jogo contra ${esc(g.o)}"></figure>`).join('')}
        <label class="drop"><input type="file" accept="image/*" multiple id="up" data-id="${g.id}"><span><b>+</b>Adicionar fotos do estádio</span></label>
      </div>
    </div>

    <div class="pager">
      ${prev ? `<a href="#jogo-${prev.id}">← ${fmt(prev.d)} · ${esc(prev.o)}</a>` : '<span></span>'}
      ${next ? `<a href="#jogo-${next.id}">${fmt(next.d)} · ${esc(next.o)} →</a>` : ''}
    </div>
  </section>`;
}

/* ---------- adversários ---------- */
function groupOpp(L){
  const m = {}; L.forEach(g => (m[g.o] ??= []).push(g));
  return Object.entries(m).map(([o, gs]) => ({o, gs, r:record(gs), last:gs[gs.length - 1]})).sort((a, b) => b.r.J - a.r.J || b.r.apr - a.r.apr || a.o.localeCompare(b.o));
}
let oppSort = {k:'J', dir:-1};
function viewAdversarios(){
  return `<section class="view"><div class="sec-h"><h2>Adversários</h2><p>${groupOpp(sorted()).length} clubes diferentes. Toque no cabeçalho para ordenar.</p></div>
    <div class="card scroll" style="padding:4px 8px" id="opp"></div></section>`;
}
function renderOpp(){
  const cols = [['o', 'Adversário'], ['J', 'J'], ['V', 'V'], ['E', 'E'], ['D', 'D'], ['G', 'Gols'], ['apr', 'Aprov.'], ['f', 'Últimos']];
  const val = (x, k) => k === 'o' ? x.o : k === 'G' ? x.r.GP - x.r.GC : k === 'f' ? x.last.d : x.r[k];
  const L = groupOpp(sorted()).sort((a, b) => { const p = val(a, oppSort.k), q = val(b, oppSort.k);
    return (typeof p === 'string' ? p.localeCompare(q) : p - q) * oppSort.dir || b.r.J - a.r.J; });
  document.getElementById('opp').innerHTML = `<table><thead><tr>${cols.map(([k, l]) => `<th class="${k === 'o' || k === 'f' ? '' : 'num'}"><button type="button" data-k="${k}" style="border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit">${l}${oppSort.k === k ? (oppSort.dir < 0 ? ' ↓' : ' ↑') : ''}</button></th>`).join('')}</tr></thead>
  <tbody>${L.map(x => `<tr><td><b>${esc(x.o)}</b>${CLASSICOS[x.o] ? ` <span class="tag c">clássico</span>` : ''}</td><td class="num">${x.r.J}</td><td class="num">${x.r.V}</td><td class="num">${x.r.E}</td><td class="num">${x.r.D}</td>
    <td class="num">${x.r.GP}x${x.r.GC}</td><td class="num">${pct(x.r.apr)}</td><td><a class="form" href="#jogo-${x.last.id}" title="Último: ${fmt(x.last.d)}">${x.gs.slice(-5).map(g => pill(res(g))).join('')}</a></td></tr>`).join('')}</tbody></table>`;
}

/* ---------- registrar ---------- */
function viewRegistrar(){
  const opps = [...new Set(games.map(g => g.o))].sort((a, b) => a.localeCompare(b));
  const today = '2026-10-31';
  return `<section class="view">
    <div class="sec-h"><h2>Registrar jogo</h2><p>Só data, adversário e placar são obrigatórios. O resto dá para completar depois.</p></div>
    <form class="frm" id="frm" novalidate>
      <fieldset class="fs"><legend>O jogo</legend>
        <div class="grid">
          <label class="in">Data<input type="date" id="f-d" required max="${today}" value="${today}"></label>
          <label class="in">Competição<select id="f-comp"><option value="">Escolher depois</option>${COMPS.map(c => `<option>${c}</option>`).join('')}</select></label>
          <label class="in">Fase ou rodada<input id="f-fase" placeholder="Ex.: 32ª rodada, final (volta)"></label>
        </div>
        <div class="scoreline">
          <div class="in"><span>Mandante</span><div class="sport-fixed">Sport</div></div>
          <label class="in">Gols<input type="number" id="f-s" min="0" max="20" inputmode="numeric" value="0"></label>
          <span class="x">x</span>
          <label class="in">Gols<input type="number" id="f-a" min="0" max="20" inputmode="numeric" value="0"></label>
          <label class="in opp">Adversário<input id="f-o" list="opps" required placeholder="Ex.: Náutico"><datalist id="opps">${opps.map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>
        </div>
      </fieldset>
      <fieldset class="fs"><legend>Onde você estava</legend>
        <div class="grid">
          <label class="in">Estádio<select id="f-est">${STADIUMS.map(s => `<option>${s}</option>`).join('')}</select></label>
          <label class="in">Setor<input id="f-setor" list="setores" placeholder="Ex.: Arquibancada"><datalist id="setores"><option value="Arquibancada"><option value="Cadeira"><option value="Social"><option value="Visitante"></datalist><small>A lista cresce com os setores que você já usou.</small></label>
          <label class="in">Público<input type="number" id="f-pub" min="0" inputmode="numeric" placeholder="Ex.: 25000"></label>
          <label class="in">Com quem<input id="f-com" placeholder="Ex.: pai, Lucas"></label>
        </div>
      </fieldset>
      <fieldset class="fs"><legend>Destaques</legend>
        <div class="chips">${['Título', 'Final', 'Acesso', 'Estreia', 'Despedida', 'Virada', 'Chuva', 'Jogo noturno'].map((t, i) => `<label><input type="checkbox" name="tg" value="${t}" id="tg${i}"><span>${t}</span></label>`).join('')}</div>
        <label class="in">Anotação<textarea id="f-note" placeholder="Gol no fim, festa da torcida, o que você quiser lembrar"></textarea></label>
      </fieldset>
      <fieldset class="fs"><legend>Fotos</legend>
        <div class="photos" id="f-prev"><label class="drop"><input type="file" accept="image/*" multiple id="f-ph"><span><b>+</b>Escolher fotos</span></label></div>
      </fieldset>
      <div class="actions"><button class="btn" type="submit">Salvar jogo</button><a class="btn ghost" href="#jogos" style="display:inline-grid;place-items:center;text-decoration:none">Cancelar</a>
        <span class="proto">Protótipo: o jogo fica só nesta aba e some ao recarregar.</span></div>
    </form>
  </section>`;
}
let draftPhotos = [];

/* ================= router ================= */
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function route(){
  const h = location.hash.slice(1) || 'resumo';
  const m = h.match(/^jogo-(\d+)$/);
  const v = m ? 'jogos' : ['resumo', 'jogos', 'adversarios', 'registrar'].includes(h) ? h : 'resumo';
  document.querySelectorAll('.tabs a').forEach(a => a.dataset.v === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (m) app.innerHTML = viewJogo(+m[1]);
  else if (v === 'resumo'){ app.innerHTML = viewResumo(); drawChart(); }
  else if (v === 'jogos'){ app.innerHTML = viewJogos(); renderList(); }
  else if (v === 'adversarios'){ app.innerHTML = viewAdversarios(); renderOpp(); }
  else { draftPhotos = []; app.innerHTML = viewRegistrar(); }
  window.scrollTo(0, 0);
}

app.addEventListener('input', e => {
  if (e.target.id === 'fq'){ F.q = e.target.value; renderList(); }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fy'){ F.y = t.value; renderList(); }
  if (t.id === 'fs'){ F.star = t.checked; renderList(); }
  if (t.id === 'up'){ const g = games.find(x => x.id === +t.dataset.id);
    g.photos.push(...[...t.files].map(f => URL.createObjectURL(f))); route(); toast(`${t.files.length} foto(s) adicionada(s) neste protótipo.`); }
  if (t.id === 'f-ph'){ const urls = [...t.files].map(f => URL.createObjectURL(f)); draftPhotos.push(...urls);
    t.closest('.drop').insertAdjacentHTML('beforebegin', urls.map(u => `<figure><img src="${u}" alt="Foto escolhida"></figure>`).join('')); }
});
app.addEventListener('click', e => {
  const b = e.target.closest('button[data-r]'); if (b){ F.r = b.dataset.r; app.querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderList(); }
  const k = e.target.closest('button[data-k]'); if (k){ oppSort = {k:k.dataset.k, dir:oppSort.k === k.dataset.k ? -oppSort.dir : (k.dataset.k === 'o' ? 1 : -1)}; renderOpp(); }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const d = v('f-d'), o = v('f-o');
  if (!d || !o){ toast(!d ? 'Escolha a data do jogo.' : 'Digite o adversário.'); document.getElementById(!d ? 'f-d' : 'f-o').focus(); return; }
  const tags = [...document.querySelectorAll('input[name=tg]:checked')].map(x => x.value);
  if (CLASSICOS[o]) tags.push(CLASSICOS[o]);
  const id = Math.max(...games.map(g => g.id)) + 1;
  games.push({id, d, s:+v('f-s') || 0, a:+v('f-a') || 0, o, star:false, tags, comp:v('f-comp'), note:v('f-note'),
    publico:+v('f-pub') || null, estadio:v('f-est'), setor:v('f-setor'), com:v('f-com'), warn:'', photos:draftPhotos});
  location.hash = `jogo-${id}`;
  toast('Jogo salvo.');
});
addEventListener('hashchange', route);
route();
</script>
